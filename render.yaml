# Blueprint de Render: New > Blueprint > elegir este repositorio.
# Plan gratuito: la web solo muestra el dashboard. Si nadie la visita en 15 min
# se duerme y tarda unos segundos en abrir, pero los datos no se pierden: las
# lecturas las hace GitHub Actions (.github/workflows/leer-inversor.yml) y se
# guardan en Neon.
services:
  - type: web
    name: monitoritzacio-rafael
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RUN_SCHEDULER      # las lecturas las hace GitHub Actions
        value: "false"
      - key: POLL_MINUTES
        value: "10"
      - key: SIMULATE
        value: "false"
      - key: DATABASE_URL       # la misma URL de Neon que el secret de GitHub
        sync: false
      - key: DASHBOARD_PASSWORD # contrasenya inicial del compte "admin"
        sync: false
      # Lectura cada 10 min des d'un cron extern (cron-job.org) a /api/cron?key=...
      # Així el servidor no s'adorm de dia. Calen les mateixes claus de Solis.
      - key: CRON_KEY
        sync: false
      - key: SOLIS_KEY_ID
        sync: false
      - key: SOLIS_KEY_SECRET
        sync: false
      - key: SOLIS_INVERTER_SN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
