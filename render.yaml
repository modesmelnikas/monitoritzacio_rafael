# Blueprint de Render: New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: monitoritzacio-rafael
    runtime: python
    # "starter" no se duerme; con "free" el servicio se para tras 15 min sin
    # visitas y deja de leer el inversor (ver README).
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SOLIS_KEY_ID
        sync: false
      - key: SOLIS_KEY_SECRET
        sync: false
      - key: SOLIS_INVERTER_SN
        sync: false
      - key: SOLIS_INVERTER_ID
        sync: false
      - key: SOLIS_API_URL
        value: https://www.soliscloud.com:13333
      - key: POLL_MINUTES
        value: "5"
      - key: SIMULATE
        value: "false"
      - key: DASHBOARD_USER
        value: rafael
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: monitoritzacio-rafael-db
          property: connectionString

databases:
  - name: monitoritzacio-rafael-db
    plan: basic-256mb
    region: frankfurt
