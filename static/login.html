<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>PS CLUMA SCP · Inici de sessió</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<main class="login">
  <div class="login-brand">
    <img src="/static/logo.svg" alt="" class="logo">
    <h1>PS CLUMA SCP</h1>
    <p class="sub">Monitorització de strings</p>
  </div>
  <form id="loginForm" class="card aform login-card">
    <h2>Inici de sessió</h2>
    <label>Usuari<input id="lUser" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Contrasenya<input id="lPwd" type="password" autocomplete="current-password" required></label>
    <p id="lErr" class="err"></p>
    <button type="submit" class="btn btn-full">Entrar</button>
  </form>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("lErr"); err.textContent = "";
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: document.getElementById("lUser").value, password: document.getElementById("lPwd").value }) });
  if (r.ok) location.href = "/";
  else err.textContent = r.status === 401 ? "Usuari o contrasenya incorrectes" : "Error de connexió";
});
</script>
</body>
</html>
