# Configuración de la planta de Rafael
# -------------------------------------------------------------
# 10 seguidores a dos ejes, 30 paneles de 210 W por seguidor,
# en 3 strings de 10 paneles (2,1 kWp por string, 6,3 kWp por seguidor).
# 30 strings en total.
#
# SUPOSICIÓN (revisar en campo): cada seguidor va a una MPPT del inversor
# Solis 100 kW, en el orden de la lista, y sus tres strings son las entradas
# de esa MPPT. Así, el seguidor 114 = MPPT 1 = PV1, PV2 y PV3, el 117 =
# MPPT 2 = PV4, PV5 y PV6, etc. Si el cableado es distinto, cambia "mppt" e
# "inputs" de cada seguidor (puede tener 1, 2 o 3 entradas).
#
# x, y: posición en el plano (unidades libres, el dashboard escala solo).
# SUPOSICIÓN: rejilla de 5 x 2 hasta tener el plano real.

plant:
  name: "Instalación FV Rafael"
  panel_wp: 210
  panels_per_string: 10

trackers:
  - { id: "114", mppt: 1 , inputs: [1, 2, 3],     x: 0, y: 0 }
  - { id: "117", mppt: 2 , inputs: [4, 5, 6],     x: 1, y: 0 }
  - { id: "119", mppt: 3 , inputs: [7, 8, 9],     x: 2, y: 0 }
  - { id: "120", mppt: 4 , inputs: [10, 11, 12],  x: 3, y: 0 }
  - { id: "121", mppt: 5 , inputs: [13, 14, 15],  x: 4, y: 0 }
  - { id: "122", mppt: 6 , inputs: [16, 17, 18],  x: 0, y: 1 }
  - { id: "123", mppt: 7 , inputs: [19, 20, 21],  x: 1, y: 1 }
  - { id: "124", mppt: 8 , inputs: [22, 23, 24],  x: 2, y: 1 }
  - { id: "125", mppt: 9 , inputs: [25, 26, 27],  x: 3, y: 1 }
  - { id: "126", mppt: 10, inputs: [28, 29, 30],  x: 4, y: 1 }

solis:
  # Cómo reparte SolisCloud las tensiones en inverterDetail:
  #   mppt  -> uPv1..uPv10 es la tensión de cada MPPT (sus strings la comparten)
  #   input -> uPvN es la tensión de cada entrada PV (1..30)
  # SUPOSICIÓN: "mppt". Se confirma con la primera lectura real (/api/raw).
  voltage_by: mppt

analysis:
  # Por debajo de esta corriente media no se evalúa (noche, amanecer).
  min_median_current_a: 1.0
  # Desviación de corriente respecto a la mediana de todos los strings.
  warning_pct: 10
  alarm_pct: 25
  # Desviación de tensión de MPPT respecto a la mediana (panel en bypass, etc.).
  voltage_warning_pct: 5
